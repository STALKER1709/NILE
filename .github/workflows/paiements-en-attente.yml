name: Balayage des paiements en attente

# Dernier filet du parcours de paiement : rattrape les commandes dont le
# paiement a abouti chez le fournisseur sans que nous l'apprenions (webhook
# jamais émis ou perdu, acheteur ayant fermé son navigateur). Cadence de 5 min
# car il y a de l'argent encaissé en jeu — Vercel Hobby ne permet qu'une
# exécution planifiée par jour, d'où le déclenchement depuis ici.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Permet de déclencher manuellement depuis l'onglet Actions (test).
  workflow_dispatch:

# Deux passages ne doivent pas se chevaucher : ils interrogeraient les mêmes
# paiements en double chez le fournisseur.
concurrency:
  group: paiements-en-attente
  cancel-in-progress: false

jobs:
  balayage:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le balayage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL_SITE: ${{ vars.URL_SITE || 'https://nile-beige.vercel.app' }}
        run: |
          # Échec BRUYANT, et non plus silencieux : depuis que des paiements
          # réels transitent, un balayage qui ne tourne pas est un défaut, pas
          # une configuration facultative. Un workflow rouge et son courriel
          # valent mieux qu'une commande payée figée découverte des jours plus
          # tard.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET absent des secrets du dépôt GitHub."
            echo "Le balayage ne peut pas tourner : un acheteur qui paie puis"
            echo "ferme son navigateur ne serait plus rattrapé."
            exit 1
          fi
          code=$(curl -sS -o /tmp/reponse.json -w "%{http_code}" \
            -X POST "$URL_SITE/api/cron/paiements-en-attente" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/reponse.json
          echo
          # 503 = la route se déclare inactive, donc CRON_SECRET manque côté
          # HÉBERGEUR. C'est le cas le plus traître : le secret est posé ici,
          # tout semble configuré, et le filet ne tourne pas.
          if [ "$code" = "503" ]; then
            echo "::error::CRON_SECRET absent côté Vercel (la route répond 503)."
            echo "Pose-le dans Vercel > Settings > Environment Variables, à"
            echo "l'identique de celui des secrets du dépôt."
            exit 1
          fi
          [ "$code" = "200" ]
