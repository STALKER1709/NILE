# Réglages pnpm du projet.
#
# ⚠️ NE PAS ajouter un second bloc `allowBuilds:`. pnpm 11 en écrit un
# lui-même — avec la valeur « set this to true or false » — quand un paquet
# manque à la liste, et le fichier finit avec deux clés identiques. YAML
# refuse alors de se charger (« duplicated mapping key ») et plus aucune
# commande pnpm ne démarre. Si pnpm vient d'en ajouter un, remplace les
# « set this to true or false » par `true` ou `false` DANS le bloc ci-dessous,
# puis supprime le bloc qu'il a créé.
#
# Ces réglages ne sont plus lus depuis le champ `pnpm` de package.json
# (retiré en pnpm 10). Les deux clés ci-dessous cohabitent volontairement :
# la machine de développement et l'hébergeur n'ont pas forcément la même
# version de pnpm, et chacune ignore sans bruit celle qu'elle ne connaît pas.
#
# Ces paquets ont un besoin LÉGITIME d'exécuter un script d'installation :
# Prisma télécharge ses moteurs, esbuild et sharp posent un binaire natif.
# Sans autorisation, `prisma generate` et le build échouent.

# pnpm 11 : table nom -> booléen.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true

# pnpm 10 : liste d'autorisations. Ignorée par pnpm 11, qui lit `allowBuilds`.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
